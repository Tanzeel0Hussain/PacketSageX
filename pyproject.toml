[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "packetsagex"
version = "0.5.0"
description = "Wireshark PCAP/PCAPNG packet intelligence, network forensics, live monitoring, and defensive traffic analysis CLI."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Tanzeel Hussain"}]
keywords = ["pcap", "pcapng", "wireshark", "network-forensics", "nmap", "cybersecurity", "traffic-analysis"]
classifiers = ["Development Status :: 3 - Alpha","Environment :: Console","Intended Audience :: Information Technology","License :: OSI Approved :: MIT License","Programming Language :: Python :: 3","Topic :: Security","Topic :: System :: Networking :: Monitoring"]
dependencies = ["scapy>=2.6,<3", "reportlab>=4.2,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
packetsagex = "packetsagex.cli:main"

[tool.setuptools.packages.find]
include = ["packetsagex*"]

[tool.setuptools.package-data]
"packetsagex.intelligence" = ["signatures.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
